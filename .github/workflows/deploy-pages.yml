name: Deploy Crown Hair Oil to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "crown-hair-oil-v3/**"
      - "assets/**"
      - "Hair after-before *.jpg"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Crown Hair Oil V3
        working-directory: crown-hair-oil-v3
        run: |
          npm install
          npm run build

      - name: Assemble production site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r crown-hair-oil-v3/dist/. _site/
          mkdir -p _site/assets
          cp -r assets/. _site/assets/
          cp "Hair after-before 1.jpg" _site/
          cp "Hair after-before 2.jpg" _site/
          cp "Hair after-before 3.jpg" _site/
          cp "Hair after-before 4.jpg" _site/
          cp "Hair after-before 5.jpg" _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
