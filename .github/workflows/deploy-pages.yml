name: Deploy sites to GitHub Pages

on:
  push:
    branches: [main, claude/code-application-llet2j]
    paths:
      - "crown-hair-oil-mobile-app-v2.1.1-fible-5/**"
      - "crown-oil-hier-v1.2/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Mobile app (v2.1.1) — served at the site root
      - name: Build mobile app
        working-directory: crown-hair-oil-mobile-app-v2.1.1-fible-5
        run: |
          npm ci
          npm run build

      # Cinematic landing page (v1.2) — served under /v1.2
      - name: Build v1.2 landing page
        working-directory: crown-oil-hier-v1.2
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/v1.2
          cp -r crown-hair-oil-mobile-app-v2.1.1-fible-5/dist/. _site/
          cp -r crown-oil-hier-v1.2/dist/. _site/v1.2/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
